name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  linux-runner:
    name: Runner (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Dependencias
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libx11-dev libxrandr-dev libxi-dev libgl-dev libasound2-dev \
            libpulse-dev libjack-jackd2-dev libxcb1-dev libxcb-shape0-dev libxcb-xfixes0-dev libxcb-render0-dev cmake
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: runner }
      - name: Compilar decompilador y runner
        working-directory: runner
        run: cargo build --release -p gm8decompiler -p gm8emulator
      - uses: actions/upload-artifact@v4
        with:
          name: runner-linux
          path: |
            runner/target/release/gm8emulator
            runner/target/release/gm8decompiler

  vita-loader-test:
    name: VPK de prueba (PS Vita)
    runs-on: ubuntu-24.04
    container: vitasdk/vitasdk:latest
    steps:
      - name: Herramientas base
        run: apk add --no-cache git curl bash build-base || (apt-get update && apt-get install -y git curl build-essential)
      - uses: actions/checkout@v4
      - name: Inventario de librerías gráficas de VitaSDK (vitaGL)
        continue-on-error: true
        run: |
          ls $VITASDK/arm-vita-eabi/lib | grep -iE "gl|shark|mathneon|taihen|kubridge|sdl|gxm" || true
          ls $VITASDK/arm-vita-eabi/include | grep -iE "gl|shark|sdl" || true
          ls $VITASDK/arm-vita-eabi/lib/libSceShaccCg* $VITASDK/arm-vita-eabi/lib/libSceShaccCgExt* 2>&1 || true
          mkdir -p inv && cp $VITASDK/arm-vita-eabi/include/vitaGL.h inv/ || true
          arm-vita-eabi-nm -g --defined-only $VITASDK/arm-vita-eabi/lib/libvitaGL.a 2>/dev/null | awk '$2=="T"{print $3}' | sort -u > inv/vitagl_symbols.txt || true
          wc -l inv/vitagl_symbols.txt || true
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: inventario-vitagl
          path: inv/
      - name: Rust nightly + cargo-vita
        run: |
          curl -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain nightly --profile minimal -c rust-src
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
      - name: Instalar cargo-vita
        run: cargo install cargo-vita --locked
      - name: Compilar VPK
        working-directory: vita/loader-test
        run: |
          echo "VITASDK=$VITASDK"
          cargo vita build vpk --release
      - uses: actions/upload-artifact@v4
        with:
          name: reloaded-loader-test-vpk
          path: vita/loader-test/target/armv7-sony-vita-newlibeabihf/release/*.vpk

  vita-runner-bench:
    name: Runner Vita (benchmark)
    runs-on: ubuntu-24.04
    container: vitasdk/vitasdk:latest
    steps:
      - name: Herramientas base
        run: apk add --no-cache git curl bash build-base cmake || (apt-get update && apt-get install -y git curl build-essential cmake)
      - uses: actions/checkout@v4
      - name: Rust nightly + cargo-vita
        run: |
          curl -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain nightly --profile minimal -c rust-src
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
      - name: Instalar cargo-vita
        run: cargo install cargo-vita --locked
      - name: Compilar VPK del runner (modo benchmark)
        working-directory: runner/gm8emulator
        env:
          RUSTUP_TOOLCHAIN: nightly
          # simd-adler32 (decodificador PNG) usa intrínsecos NEON, aún inestables en ARM de 32 bits
          RUSTFLAGS: "-Zcrate-attr=feature(stdarch_arm_neon_intrinsics)"
          # strip es incompatible con -Wl,-q (la Vita necesita conservar las relocalizaciones)
          CARGO_PROFILE_RELEASE_STRIP: "false"
        shell: bash
        run: |
          # Si vita-elf-create no encuentra hueco tras el código (depende del tamaño exacto del
          # binario), se recompila con 8 KB de relleno (ver ELF_PAD en main.rs)
          if ! cargo vita build vpk -- --release --no-default-features --features vita 2>&1 | tee build.log; then
            if grep -q "for SCE data at end of segment" build.log; then
              echo "::warning::vita-elf-create sin hueco; recompilando con relleno"
              RLD_ELF_PAD=1 cargo vita build vpk -- --release --no-default-features --features vita
            else
              exit 1
            fi
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: reloaded-runner-bench-vpk
          path: runner/target/armv7-sony-vita-newlibeabihf/release/*.vpk
      - name: Guardar ELF con símbolos (para analizar volcados .psp2dmp)
        uses: actions/upload-artifact@v4
        with:
          name: reloaded-runner-bench-elf
          path: runner/target/armv7-sony-vita-newlibeabihf/release/gm8emulator.elf

  vita-runner-gl:
    name: Runner Vita con gráficos (vitaGL, experimental)
    runs-on: ubuntu-24.04
    container: vitasdk/vitasdk:latest
    continue-on-error: true
    steps:
      - name: Herramientas base
        run: apk add --no-cache git curl bash build-base cmake || (apt-get update && apt-get install -y git curl build-essential cmake)
      - uses: actions/checkout@v4
      - name: Rust nightly + cargo-vita
        run: |
          curl -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain nightly --profile minimal -c rust-src
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
      - name: Instalar cargo-vita
        run: cargo install cargo-vita --locked
      - name: Compilar VPK del runner con vitaGL
        working-directory: runner/gm8emulator
        env:
          RUSTUP_TOOLCHAIN: nightly
          RUSTFLAGS: "-Zcrate-attr=feature(stdarch_arm_neon_intrinsics)"
          CARGO_PROFILE_RELEASE_STRIP: "false"
        shell: bash
        run: |
          if ! cargo vita build vpk -- --release --no-default-features --features vitagl 2>&1 | tee build.log; then
            if grep -q "for SCE data at end of segment" build.log; then
              RLD_ELF_PAD=1 cargo vita build vpk -- --release --no-default-features --features vitagl
            else
              exit 1
            fi
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: reloaded-runner-gl-vpk
          path: runner/target/armv7-sony-vita-newlibeabihf/release/*.vpk
