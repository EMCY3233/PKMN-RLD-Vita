; ===== Pokémon Reloaded – Mapa de controles PS Vita =====
; Lo lee el runner Vita y convierte botones en las teclas de PC que el juego espera
; (el juego lee las teclas desde el objeto Control / script DefaultKeyAssignment).
; Formato: BOTON = TECLA   |  L+BOTON / R+BOTON = capa modificadora (mantener L o R)
; Teclas: Z X C V B S A E D F O M P K Y L H ... , UP DOWN LEFT RIGHT ENTER SPACE
;         SHIFT CTRL ESCAPE PAGEUP PAGEDOWN HOME END F1..F12 1..9 0

[base]
DPAD_UP    = UP
DPAD_DOWN  = DOWN
DPAD_LEFT  = LEFT
DPAD_RIGHT = RIGHT
LSTICK     = DPAD          ; el stick izquierdo actúa como cruceta (zona muerta 40%)
CROSS      = Z             ; Aceptar / hablar / acción (key_ex_accion, key_caja_accion…)
CIRCLE     = X             ; Cancelar / atrás
SQUARE     = C             ; Pescar / ordenar / cursor caja
TRIANGLE   = V             ; Bicicleta / ver Pokémon / forma en Pokédex
START      = ENTER         ; Menú principal
SELECT     = SPACE         ; Menú Pokémon / usar objeto
L          = SHIFT         ; Pulsación corta: mostrar ataques en combate
R          = CTRL          ; Mantener: acelerar combate (key_bt_tiempo) / ex_stop

[capa_L]                   ; Mantener L
CROSS      = S             ; Cambiar Pokémon / soltar
CIRCLE     = E             ; Huir / equipo de caja
SQUARE     = B             ; Lanzar Ball / sacar Pokémon
TRIANGLE   = D             ; Cancelar cambio / dar objeto / decoración
DPAD_UP    = PAGEUP
DPAD_DOWN  = PAGEDOWN
DPAD_LEFT  = HOME
DPAD_RIGHT = END

[capa_R]                   ; Mantener R
CROSS      = A             ; Andar / asignar objeto / grito Pokédex
CIRCLE     = O             ; Mochila / curar rápido
SQUARE     = F             ; Flauta / buscar
TRIANGLE   = M             ; Mapa / Mega evolución
DPAD_UP    = P             ; Menú entrenador / % captura
DPAD_DOWN  = K             ; Mega (explorador) / color menú
DPAD_LEFT  = Y
DPAD_RIGHT = H

[combos]
SELECT+START = ESCAPE      ; Salir (key_global_salir)
L+R+START    = F12         ; Atajo de depuración/captura (opcional)

[tactil]
FRONT_TOUCH   = MOUSE      ; Toque = clic izquierdo; mouse_x/mouse_y escalados a la resolución del juego
FRONT_HOLD_MS = 600        ; Mantener = clic derecho
REAR_TOUCH    = QUADRANTS  ; Panel trasero: 4 cuadrantes
REAR_TL = 1
REAR_TR = 2
REAR_BL = 3
REAR_BR = 4
TECLADO_VIRTUAL = SELECT+TRIANGLE ; Abre el teclado del sistema (IME) para escribir nombres (keyboard_string)

[pantalla]
ESCALADO = ENTERO_O_AJUSTE  ; 320x240 -> 640x480 centrado (x2) en 960x544; alternativa: ajustar a 725x544
FILTRO   = NEAREST
