; ===== Pokémon Reloaded – Mapa de controles PS Vita =====
; Lo lee el runner Vita (ux0:data/reloaded/keymap.ini; si no existe, usa este mismo mapa) y
; convierte botones en las teclas de PC que el juego espera (script DefaultKeyAssignment).
; Formato: BOTON = TECLA. Capas: mantener L, R o SELECT cambia lo que hace cada botón.
; L, R y SELECT pulsados solos (sin usar su capa): SELECT = ESPACIO breve; L = SHIFT (breve al
; tocarlo, mantenido mientras se mantenga L); R mantenido = CTRL (acelerar combates).
; Teclas: A-Z 0-9 UP DOWN LEFT RIGHT ENTER SPACE SHIFT CTRL ESCAPE BACKSPACE TAB
;         PAGEUP PAGEDOWN HOME END F1..F12

[base]
DPAD_UP    = UP
DPAD_DOWN  = DOWN
DPAD_LEFT  = LEFT
DPAD_RIGHT = RIGHT
LSTICK     = DPAD          ; el stick izquierdo actúa como cruceta (zona muerta 40%)
CROSS      = Z             ; Aceptar / hablar / acción
CIRCLE     = X             ; Cancelar / atrás
SQUARE     = C             ; Pescar / ordenar / aleatorio (selección de personaje)
TRIANGLE   = V             ; Bicicleta / ver Pokémon / personaje aleatorio completo
START      = ENTER         ; Menú principal
SELECT     = SPACE         ; (toque) Menú Pokémon / usar objeto
L          = SHIFT         ; (mantener) Mostrar ataques en combate
R          = CTRL          ; (mantener) Acelerar combate

[capa_L]                   ; Mantener L
CROSS      = S             ; Cambiar Pokémon / soltar
CIRCLE     = E             ; Huir (también Safari, carrera, FlyGol)
SQUARE     = B             ; Lanzar Ball / sacar Pokémon
TRIANGLE   = D             ; Cancelar cambio / dar objeto / decoración
DPAD_UP    = PAGEUP
DPAD_DOWN  = PAGEDOWN
DPAD_LEFT  = HOME
DPAD_RIGHT = END

[capa_R]                   ; Mantener R
CROSS      = A             ; Andar / asignar objeto / grito Pokédex
CIRCLE     = O             ; Mochila / curar rápido
SQUARE     = F             ; Flauta / buscar personaje por nombre
TRIANGLE   = M             ; Mapa / Mega evolución
DPAD_UP    = P             ; Menú entrenador / % captura (mantener al elegir Ball)
DPAD_DOWN  = K             ; Mega (explorador) / color menú
DPAD_LEFT  = Y
DPAD_RIGHT = H

[capa_select]              ; Mantener SELECT
CROSS      = T             ; Hablar (key_ex_hablar)
CIRCLE     = N             ; Usar objetos (key_ex_use_items)
SQUARE     = R             ; Exclamación (key_ex_exclamacion)
DPAD_UP    = F5            ; Guardar partida (key_global_guardar)
DPAD_DOWN  = F6            ; Cargar partida (key_global_cargar)
DPAD_LEFT  = F8            ; Móvil (key_menu_movil)
DPAD_RIGHT = F11           ; Opciones (key_menu_opciones)
L          = F1            ; Ayuda (key_menu_ayuda)
R          = Q             ; Misiones (key_menu_misiones)
; SELECT+TRIANGLE = teclado del sistema; SELECT+START = ESCAPE (ver combinaciones)

[combos]                   ; mantener los botones a la vez; a la derecha, teclas que se pulsan juntas
SELECT+START = ESCAPE      ; Salir (key_global_salir)
L+R+CIRCLE   = GUIA        ; Guía de controles y cambio de botones sin salir del juego
L+R+SQUARE   = BARRA       ; Mostrar/ocultar la barra de números táctil
L+R+SELECT   = BARRA       ; (igual)
L+R+TRIANGLE = CTRL+P      ; Selección de personaje: desbloquear todos los personajes (truco del juego)
L+R+CROSS    = F2          ; Reiniciar (key_global_reiniciar)
L+R+START    = F3          ; Introducir código (key_global_code)
L+R+DPAD_DOWN = 0          ; Comandos (key_menu_comandos)
; Sin botón a propósito: escala (F7), captura (F9: la Vita tiene la suya con PS+START) y
; música sí/no (F10: se puede cambiar en Opciones del juego)

[tactil]
FRONT_TOUCH   = MOUSE      ; Toque = clic; mantener y arrastrar = arrastrar; en coordenadas del juego
; Barra de teclas en pantalla (laterales): 1-6 a la izquierda, 7 8 9 0 \ L a la derecha
; Se muestra/oculta con L+R+Cuadrado (o L+R+SELECT); tocar una tecla la pulsa (Pokémon 1-6 en combate, MO 5/6/7,
; 8 habilidades externas, 9 Xpod, 0 comandos, \ ver Pokémon, L áreas). El resto de la pantalla
; sigue siendo ratón.
; Panel trasero: desactivado por defecto (roces). Para activarlo, asignar zonas (arriba 1 2 3 /
; abajo 4 5 6, y con L mantenido REAR_L1..REAR_L6), p. ej.:
; REAR_1 = 1
; REAR_L5 = BACKSLASH
TECLADO_VIRTUAL = SELECT+TRIANGLE ; Teclado del sistema; se abre solo cuando el juego pide un nombre

[pantalla]
ESCALADO = ENTERO          ; 320x180 -> 960x540 (x3), 320x240 -> 640x480 (x2), centrado
FILTRO   = NEAREST
